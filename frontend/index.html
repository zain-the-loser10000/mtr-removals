<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <meta name="theme-color" content="#0f1012" />
    <meta name="geo.region" content="AU-NSW" />
    <meta name="geo.placename" content="Newcastle" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MTR Removals" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:image" content="https://www.mtrremovals.com.au/images/movers-carrying-sofa.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/images/movers-carrying-sofa.jpg" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MovingCompany",
      "@id": "https://www.mtrremovals.com.au/#business",
      "name": "MTR Removals",
      "slogan": "Move. Truck. Removals.",
      "description": "Removalists in Newcastle NSW offering home moves, office relocations, furniture removals and interstate moves.",
      "url": "https://www.mtrremovals.com.au",
      "logo": "https://www.mtrremovals.com.au/images/mtr-logo.png",
      "image": "https://www.mtrremovals.com.au/images/movers-carrying-sofa.jpg",
      "telephone": "+61469799346",
      "email": "mtrremovals.au@gmail.com",
      "priceRange": "$$",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Newcastle",
        "addressRegion": "NSW",
        "addressCountry": "AU"
      },
      "areaServed": [
        { "@type": "City", "name": "Newcastle" },
        { "@type": "City", "name": "Lake Macquarie" },
        { "@type": "City", "name": "Maitland" },
        { "@type": "City", "name": "Cessnock" },
        { "@type": "City", "name": "Port Stephens" },
        { "@type": "AdministrativeArea", "name": "Hunter Region" },
        { "@type": "Country", "name": "Australia" }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Removal services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Home Moves" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Office Moves" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Furniture Removals" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Interstate Moves" } }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
